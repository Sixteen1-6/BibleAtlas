name: Mirror Project Gutenberg texts

# The build's sources are pinned git commits on github.com (sources.json), and
# the containers that build the data can only reach github.com. This copies
# three public-domain Project Gutenberg ebooks of Martin Luther's commentaries
# (1549 Galatians, 48193 and 27978 Genesis) unchanged to one branch each,
# mirror/pg-<number>, with a SOURCE.md that records where each came from, its
# size and SHA-256, and Project Gutenberg's rights line for it. sources.json
# then pins the commit and the file's hash. If Project Gutenberg refuses the
# download, the GITenberg snapshot of October 2018 on GitHub is copied instead
# and SOURCE.md says so. Never force-push or delete these branches. Decision 2
# (2026-10-20) approved Luther's commentaries; decision 23 (8) settles the
# Galatians credit.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror-web-texts.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - book: "1549"
            title: "Commentary on the Epistle to the Galatians"
            starts: "CHAPTER 1"
            fallback: "https://raw.githubusercontent.com/GITenberg/Commentary-on-the-Epistle-to-the-Galatians_1549/e362c0a3444c3f9c9668eb4157a76c3bcd59a223/1549.txt"
          - book: "48193"
            title: "Commentary on Genesis, Vol. I: Luther on the Creation"
            starts: "CHAPTER I."
            fallback: "https://raw.githubusercontent.com/GITenberg/Commentary-on-Genesis-Vol-I-Luther-on-the-Creation_48193/8d4140fd0b6e85bb7bfb00bf6525caf1ac63a7c9/48193-8.txt"
          - book: "27978"
            title: "Commentary on Genesis, Vol. II: Luther on Sin and the Flood"
            starts: "CHAPTER IV."
            fallback: "https://raw.githubusercontent.com/GITenberg/Commentary-on-Genesis-Vol.-IILuther-on-Sin-and-the-Flood_27978/8319ed17c0af0dde6505838d501034ec7df245fb/27978.txt"
    concurrency:
      group: mirror-pg-${{ matrix.book }}
      cancel-in-progress: false
    env:
      BOOK: ${{ matrix.book }}
      TITLE: ${{ matrix.title }}
      STARTS: ${{ matrix.starts }}
      FALLBACK: ${{ matrix.fallback }}
      BRANCH: mirror/pg-${{ matrix.book }}
    steps:
      - name: Download the text and its rights line
        run: |
          set -euo pipefail
          mkdir -p /tmp/m/out && cd /tmp/m
          UA="BibleAtlas-mirror (GitHub Actions)"
          FROM="https://www.gutenberg.org/cache/epub/$BOOK/pg$BOOK.txt"
          PAGE="https://www.gutenberg.org/ebooks/$BOOK"
          if curl -sSfL --retry 3 -A "$UA" "$FROM" -o "out/pg$BOOK.txt" && curl -sSfL --retry 3 -A "$UA" "$PAGE" -o page.html; then
            echo "VIA=gutenberg" >> "$GITHUB_ENV"
            echo "FILE=pg$BOOK.txt" >> "$GITHUB_ENV"
          else
            echo "Project Gutenberg refused the download; copying the GITenberg snapshot instead."
            rm -f "out/pg$BOOK.txt" page.html
            NAME="$(basename "$FALLBACK")"
            curl -sSfL --retry 3 "$FALLBACK" -o "out/$NAME"
            echo "VIA=gitenberg" >> "$GITHUB_ENV"
            echo "FILE=$NAME" >> "$GITHUB_ENV"
            FROM="$FALLBACK"
          fi
          echo "FROM=$FROM" >> "$GITHUB_ENV"

      - name: Check the text and write SOURCE.md
        run: |
          set -euo pipefail
          cd /tmp/m
          python3 - <<'EOF'
          import hashlib, html, os, re
          book, title, starts = os.environ["BOOK"], os.environ["TITLE"], os.environ["STARTS"]
          via, name, src = os.environ["VIA"], os.environ["FILE"], os.environ["FROM"]
          data = open(f"out/{name}", "rb").read()
          text = data.decode("utf-8") if via == "gutenberg" else data.decode("latin-1")
          lines = [l.rstrip("\r") for l in text.split("\n")]
          assert any(l.startswith("*** START OF") for l in lines), f"{name}: no START line"
          assert any(l.startswith("*** END OF") for l in lines), f"{name}: no END line"
          assert starts in lines, f"{name}: no line {starts!r}"
          assert len(data) > 300_000, f"{name}: only {len(data)} bytes"
          rights = "Public domain in the USA."
          release = updated = ""
          if via == "gutenberg":
              page = open("page.html", encoding="utf-8", errors="replace").read()
              plain = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", page)).split())
              def field(pattern):
                  m = re.search(pattern, plain)
                  return m.group(1) if m else ""
              rights = field(r"Copyright(?: Status)? (Public domain in the USA\.)") or "(not found on the page)"
              release = field(r"Release Date (\w+ \d+, \d{4})")
              updated = field(r"(?:Last Update|Most Recently Updated) (\w+ \d+, \d{4})") or "(not given)"
              if not rights.startswith("Public domain in the USA"):
                  i = plain.find("Copyright")
                  print(plain[max(0, i - 300):i + 300] if i >= 0 else plain[:1500])
              assert rights.startswith("Public domain in the USA"), f"ebook {book}: copyright status {rights!r}"
          sha = hashlib.sha256(data).hexdigest()
          src_line = (f"Project Gutenberg ebook {book}, {src}, its current file"
                      if via == "gutenberg" else
                      f"Project Gutenberg ebook {book} as copied by GITenberg in October 2018, {src} "
                      "(Project Gutenberg refused the workflow's download)")
          open("out/SOURCE.md", "w", encoding="utf-8").write(
              f"# {title}, mirrored\n\n"
              f"Copied unchanged from {src_line},\n"
              "by .github/workflows/mirror-web-texts.yml.\n\n"
              "## Rights\n\n"
              f"Project Gutenberg's page for ebook {book} (https://www.gutenberg.org/ebooks/{book}), copyright status: {rights}\n"
              + (f"Release date: {release}. Last update: {updated}.\n" if via == "gutenberg" else "")
              + "\nProject Gutenberg's header and license are not used by Bible Atlas.\n\n"
              "| file | bytes | sha256 |\n|---|---|---|\n"
              f"| {name} | {len(data)} | {sha} |\n")
          print(open("out/SOURCE.md", encoding="utf-8").read())
          EOF

      - name: Commit the copy to its own branch
        run: |
          set -euo pipefail
          # The branch keeps its history: a pinned commit must stay fetchable.
          mkdir /tmp/mirror && cd /tmp/mirror
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch -q origin "$BRANCH"
            git checkout -q -b "$BRANCH" FETCH_HEAD
            # A later run must not swap the copy that is pinned: keep the branch as it is.
            echo "The branch already exists: $(git rev-parse HEAD); not changed."
            exit 0
          fi
          git checkout -q --orphan "$BRANCH"
          cp -r /tmp/m/out/. .
          git add -A
          git commit -q -m "Mirror Project Gutenberg ebook $BOOK ($VIA, fetched $(date -u +%F))"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "Mirrored to $BRANCH at $(git rev-parse HEAD)"
