        function squash(s) {
          return s.toLowerCase().replace(/[^a-z0-9]/g, '');

        books.forEach(function (b, i) {
          b.keys.concat([squash(b.name), squash(b.osis)]).forEach(function (k) {

        /** A typed book name: an alias, the full name or the OSIS id, else a

        function findBook(key) {
          if (!key) return -1;
          if (Object.prototype.hasOwnProperty.call(exact, key)) return exact[key];
          if (key.length < 3) return -1;
          var hit = -1;
          for (var i = 0; i < books.length; i++) {
            if (squash(books[i].name).indexOf(key) === 0) {
              if (hit >= 0) return -1;
              hit = i;
            }
          }
          return hit;

        var ORDINAL = { i: '1', ii: '2', iii: '3', first: '1', second: '2', third: '3', '1st': '1', '2nd': '2', '3rd': '3' };

    <script>
      (function () {
        var s = window.__atlas404;
        if (!s) return;
        document.title = 'Page not found · Bible Atlas';
        var go = document.getElementById('go');
        var alt = document.getElementById('alt');
        go.href = alt.href = s.home;
        document.getElementById('eg1').textContent = s.home + 'John.3.16';
        document.getElementById('eg2').textContent = s.home + 'Psalm-23';
        if (s.found && s.found.book) {
          // A real book with a chapter it does not have.
          document.getElementById('title').textContent = 'That chapter isn’t there';
          document.getElementById('why').textContent = s.found.message;
          go.textContent = 'Open ' + s.found.book.name;
          go.href = s.home + '#r=' + s.found.book.osis + '.1';
          alt.hidden = false;
        }
      })();
    </script>
