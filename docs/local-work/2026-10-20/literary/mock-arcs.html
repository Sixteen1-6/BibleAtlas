<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literary Arcs Mockup</title>
<meta name="description" content="Bible Atlas mockup: literary devices drawn as arcs in the map's own language, at Simple, Study and Deep, desktop and phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Serif+Hebrew:wght@400;500&display=swap" rel="stylesheet">
<script>
  // The page theme follows the system until the theme button is used (as the app does).
  try {
    var t = localStorage.getItem('mk.theme');
    document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<style>
/* ===== Tokens: copied from web/src/styles.css at origin/main, plus two new link kinds. ===== */
:root {
  --sky: #070a16;
  --sky-2: #121833;
  --sky-glass: rgba(9, 12, 28, 0.74);
  --sky-glass-strong: rgba(9, 12, 28, 0.92);
  --sky-line: rgba(160, 172, 235, 0.15);
  --sky-ink: #f3eee2;
  --sky-muted: #949cbd;
  --lamp: #ffd27a;
  --lamp-glow: rgba(255, 210, 122, 0.55);
  --page: #f4efe4;
  --surface: #fffcf6;
  --surface-2: #f8f3ea;
  --ink: #1c1f30;
  --muted: #625f72;
  --line: #e4dccd;
  --accent: #9a5a06;
  --accent-soft: #fbe9c6;
  --lit-soft: rgba(251, 233, 198, 0.4);
  --lit-edge: rgba(154, 90, 6, 0.32);
  --link: #3546c4;
  --variant: #b4560f;
  --focus: #4f5dff;
  --quote: #c93a78;
  --parallel: #1f84bf;
  /* New: a literary form (lines, mirrors, figures) and a pair of people. Deepened for paper. */
  --form: #6a48c4;
  --foil: #ad4722;
  /* The map is a night sky in both page themes, so its colours never change. */
  --form-sky: #c4b0ff;
  --foil-sky: #ff9f7a;
  --font-ui: 'Instrument Sans', system-ui, sans-serif;
  --font-read: 'Literata', Georgia, serif;
  --font-hebrew: 'Noto Serif Hebrew', 'SBL Hebrew', 'Times New Roman', serif;
  --r-sm: 4px;
  --r-md: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --page: #080b17; --surface: #0e1324; --surface-2: #141a30; --ink: #ece6d6; --muted: #9aa0bd;
    --line: rgba(160, 172, 235, 0.13); --accent: #f5c46a; --accent-soft: rgba(245, 196, 106, 0.13);
    --lit-soft: rgba(245, 196, 106, 0.07); --lit-edge: rgba(245, 196, 106, 0.5); --link: #a3b4ff;
    --variant: #ffa45c; --focus: #8fa2ff; --quote: #ff8fbf; --parallel: #7fd4ff;
    --form: #c4b0ff; --foil: #ffa784;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --page: #080b17; --surface: #0e1324; --surface-2: #141a30; --ink: #ece6d6; --muted: #9aa0bd;
  --line: rgba(160, 172, 235, 0.13); --accent: #f5c46a; --accent-soft: rgba(245, 196, 106, 0.13);
  --lit-soft: rgba(245, 196, 106, 0.07); --lit-edge: rgba(245, 196, 106, 0.5); --link: #a3b4ff;
  --variant: #ffa45c; --focus: #8fa2ff; --quote: #ff8fbf; --parallel: #7fd4ff;
  --form: #c4b0ff; --foil: #ffa784;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--link); }
.he { font-family: var(--font-hebrew); direction: rtl; }
.muted { color: var(--muted); }

/* ===== Mockup chrome (not part of the app) ===== */
.mk-bar { max-width: 1480px; margin: 0 auto; padding: 18px 16px 10px; display: grid; gap: 10px; }
.mk-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.mk-title h1 { margin: 0; font: 600 22px/1.2 var(--font-read); }
.mk-title span { color: var(--muted); font-size: 13px; }
.mk-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.mk-row > .lab { font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mk-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.mk-seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink); }
.mk-seg button[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); }
.mk-hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.mk-stage { max-width: 1480px; margin: 8px auto 0; padding: 4px 16px 16px; display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.mk-stage.both .device.desk { flex: 1 1 auto; min-width: 0; }
.mk-stage.both .device.phone { flex: 0 0 auto; }
@media (max-width: 1240px) { .mk-stage.both { flex-direction: column; align-items: center; } .mk-stage.both .device.desk { width: 100%; } }
.mk-notes { max-width: 1480px; margin: 0 auto; padding: 0 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.mk-card { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 12px 14px; }
.mk-card h3 { margin: 0 0 8px; font: 600 13px var(--font-ui); color: var(--muted); }
.mk-card ul { margin: 0; padding-left: 18px; }
.mk-card li { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; }
.mk-legend { display: grid; gap: 8px; }
.mk-legend div { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; font-size: 13px; line-height: 1.4; }
.mk-legend svg { width: 74px; height: 34px; border-radius: 6px; background: radial-gradient(ellipse 80% 70% at 50% 90%, #141a3c, #070a16 75%); }

/* ===== Devices ===== */
.device { position: relative; container: app / inline-size; background: var(--page); overflow: hidden; }
.device.desk { width: 100%; max-width: 1440px; height: 880px; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px -30px rgba(6, 10, 22, .55); }
.device.phone { width: 390px; max-width: 100%; height: 844px; border: 10px solid #0b0d14; border-radius: 40px; box-shadow: 0 18px 50px -24px rgba(6, 10, 22, .6); }
.device-label { position: absolute; top: -22px; left: 4px; font-size: 12px; color: var(--muted); }
.devwrap { position: relative; padding-top: 22px; }
.mk-stage:not(.both) .devwrap { width: 100%; display: flex; justify-content: center; }
.mk-stage.both .devwrap.d { flex: 1 1 auto; min-width: 0; }
@media (max-width: 1240px) { .mk-stage.both .devwrap.d { width: 100%; } }
.mk-stage:not(.both) .devwrap .device.desk { margin: 0 auto; }

/* ===== The app (subset of styles.css, small screens via a container query) ===== */
.app { position: relative; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: linear-gradient(180deg, #03050c, var(--sky)); color: var(--sky-ink); border-bottom: 1px solid var(--sky-line); position: relative; z-index: 5; }
.brand { font-family: var(--font-read); background: linear-gradient(90deg, #ffe3a3, var(--lamp) 45%, #ffb36b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 18px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand small { -webkit-text-fill-color: var(--sky-muted); font-family: var(--font-ui); font-weight: 400; font-size: 12px; color: var(--sky-muted); margin-left: 8px; }
.searchbox { flex: 1; min-width: 0; max-width: 520px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: var(--r-md); border: 1px solid var(--sky-line); background: var(--sky-2); color: var(--sky-muted); text-align: left; }
.searchbox .ph { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.searchbox kbd { margin-left: auto; font: 12px var(--font-ui); padding: 1px 6px; border: 1px solid var(--sky-line); border-radius: var(--r-sm); }
.seg { display: inline-flex; border: 1px solid var(--sky-line); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; color: var(--sky-muted); }
.seg button[aria-pressed='true'] { background: var(--sky-2); color: var(--sky-ink); box-shadow: inset 0 -2px 0 var(--lamp); }
.topbar .spacer { flex: 1; }
.depthseg button { padding: 6px 12px; }
.depthwrap { position: relative; }
.depthhint { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; width: max-content; max-width: min(270px, calc(100cqw - 32px)); margin: 0; padding: 7px 11px; border: 1px solid var(--sky-line); border-left: 2px solid var(--lamp); border-radius: var(--r-md); background: #0b0f22; color: var(--sky-ink); font: 13px/1.4 var(--font-ui); box-shadow: 0 6px 20px rgba(0, 0, 0, .35); pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(-3px); transition: opacity .18s, transform .18s, visibility 0s .18s; }
.depthhint.on { visibility: visible; opacity: 1; transform: none; transition: opacity .18s, transform .18s; }
.iconbtn { display: inline-flex; align-items: center; border: 1px solid var(--sky-line); background: transparent; color: var(--sky-ink); border-radius: var(--r-md); padding: 6px 10px; }
.godeeper { display: block; margin-top: 14px; padding: 0; border: 0; background: none; color: var(--link); font: 14px var(--font-ui); text-align: left; }
.godeeper:hover { text-decoration: underline; }

.map { position: relative; height: 360px; background: radial-gradient(ellipse 80% 70% at 50% 85%, #141a3c, var(--sky) 70%); color: var(--sky-ink); overflow: hidden; user-select: none; }
.map canvas.arcs, .map svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.map svg.overlay { pointer-events: none; }
.map svg.overlay [data-pair] { pointer-events: auto; cursor: default; }
.map .strip { position: absolute; left: 0; right: 0; height: 6px; width: 100%; opacity: .85; }
.map .hud { position: absolute; left: 10px; top: 8px; z-index: 3; padding: 5px 10px; border-radius: var(--r-md); background: var(--sky-glass); backdrop-filter: blur(6px); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--sky-muted); max-width: calc(100% - 170px); }
.map .hud strong { color: var(--sky-ink); font-weight: 600; }
.map .hud .litname { color: var(--sky-ink); }
.kdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--k); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 6px var(--k); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend i.wide { display: inline-block; width: 120px; height: 4px; border-radius: 2px; }
.seg.mini button { padding: 2px 8px; font-size: 12px; }
.votes { display: flex; align-items: center; gap: 6px; }
.map .zoomhint { position: absolute; right: 10px; top: 8px; z-index: 3; padding: 5px 10px; border-radius: var(--r-md); background: var(--sky-glass); font-size: 12px; color: var(--sky-muted); text-align: right; }
.map .zoomhint button { background: transparent; border: 1px solid var(--sky-line); color: var(--sky-ink); border-radius: var(--r-sm); padding: 2px 8px; margin-left: 6px; }
.map .zoomhint button.clear { border-color: var(--lamp); color: var(--lamp); }
.map .litcap { position: absolute; left: 10px; top: 8px; z-index: 3; padding: 5px 10px; border-radius: var(--r-md); background: var(--sky-glass); backdrop-filter: blur(6px); font-size: 12px; color: var(--sky-ink); max-width: calc(100% - 170px); }
.booklabel { font: 11px var(--font-ui); fill: var(--sky-muted); }
.booklabel.on { fill: var(--sky-ink); }
.chaplabel { font: 10px var(--font-ui); fill: var(--sky-muted); }
.vnum { font: 9.5px var(--font-ui); fill: var(--sky-muted); opacity: .8; }
.nodelabel { font: 600 11.5px var(--font-ui); fill: var(--sky-ink); paint-order: stroke; stroke: var(--sky); stroke-width: 3px; }
.kindarc path { fill: none; stroke: var(--kind); stroke-width: 1.8; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--kind) 60%, transparent)); }
.kindarc circle { fill: var(--kind); }
/* New: arcs for a literary form (lilac) or a pair of people (ember). */
.sarc path { fill: none; stroke: var(--k); stroke-width: 1.8; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--k) 60%, transparent)); transition: stroke .12s; }
.sarc circle { fill: var(--k); }
.sarc.faint path { stroke-width: 1.2; opacity: .6; filter: none; stroke-dasharray: none; }
.sarc.faint circle { opacity: .6; }
.sarc .tick { stroke: var(--k); stroke-width: 2; }
.sband { fill: var(--k); opacity: .9; }
.sband.faint { opacity: .45; }
.sarc.hl path, .sarc.hl .tick { stroke: var(--lamp); filter: drop-shadow(0 0 5px var(--lamp-glow)); opacity: 1; }
.sarc.hl circle { fill: var(--lamp); }
.slab { font: 500 10.5px var(--font-ui); fill: var(--k); paint-order: stroke; stroke: var(--sky); stroke-width: 3px; }
.slab.hl { fill: var(--lamp); }
.slet { font: 600 9.5px var(--font-ui); fill: var(--k); letter-spacing: .04em; }
.slet.hl { fill: var(--lamp); }
.shew { font: 13px var(--font-hebrew); fill: var(--sky-muted); }
.stag { font: 600 8.5px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; fill: var(--k); paint-order: stroke; stroke: var(--sky); stroke-width: 3px; }
.sturn { stroke: var(--sky-muted); stroke-width: 1; stroke-dasharray: 2 3; }
.lens { position: absolute; z-index: 2; border: 1px solid rgba(196, 176, 255, .32); border-radius: var(--r-md); background: rgba(9, 12, 28, .8); backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); overflow: hidden; }
.lens .cap { position: absolute; left: 10px; top: 7px; font: 11px var(--font-ui); color: var(--sky-muted); }
.lens .cap b { color: var(--sky-ink); font-weight: 600; }
.lens svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.work { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); min-height: 0; }
.reader { overflow: auto; padding: 20px clamp(16px, 4cqw, 48px) 60px; border-right: 1px solid var(--line); }
.study { overflow: auto; background: var(--surface); min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; overflow-x: auto; flex-shrink: 0; }
.tabs button { border: 0; background: none; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 16px 18px 60px; }
.panel h2 { font: 600 20px/1.25 var(--font-read); margin: 0 0 4px; }
.panel p { margin: 0 0 10px; }
.panel h3 { font: 600 13px var(--font-ui); color: var(--muted); margin: 22px 0 8px; }
.refrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.refrow .ref { font-weight: 600; }
.refrow .vt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.refrow .snip { grid-column: 1 / -1; font: 14px/1.5 var(--font-read); color: var(--muted); }
.readhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 760px; margin: 0 auto 18px; }
.readhead h1 { font: 600 28px/1.15 var(--font-read); margin: 0; }
.readhead .nav { display: flex; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 5px 10px; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; max-width: 760px; margin: -6px auto 16px; font-size: 13px; }
.toggles .hint { align-self: center; color: var(--muted); margin-left: 4px; }
.verses { max-width: 760px; margin: 0 auto; }
.verse { padding: 8px 10px; margin: 0 -10px; border-radius: var(--r-md); transition: background-color .12s, box-shadow .12s; }
.verse.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.verse.soft { background: var(--lit-soft); box-shadow: inset 3px 0 0 var(--lit-edge); }
.verse.gapafter { margin-bottom: 10px; }
.verse .en { font: 17px/1.65 var(--font-read); }
.verse .num { font: 600 11px var(--font-ui); color: var(--accent); vertical-align: super; margin-right: 4px; border: 0; background: none; padding: 0; }
.verse .xc { font: 11px var(--font-ui); color: var(--muted); margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; background: none; vertical-align: 2px; white-space: nowrap; }
.verse.sel .xc { color: var(--accent); border-color: var(--accent); }
/* New: the BSB's own poetry lines (\q1, \q2, \d, \b), read from the pinned USFM. */
.ln { display: block; padding-left: 1.3em; text-indent: -1.3em; }
.ln.q2 { padding-left: 2.6em; }
.ln.q0 { padding-left: 0; text-indent: 0; }
.ln.gap { margin-top: .7em; }
.ln.title { padding-left: 0; text-indent: 0; font: italic 14.5px/1.5 var(--font-read); color: var(--muted); margin-bottom: 2px; }
.orig { margin-top: 4px; line-height: 2; }
.orig.he { font-size: 22px; text-align: right; }
.w { padding: 0 1px; border-radius: 3px; }
/* New: words lit by a form or a pair; the letter says which partner. */
.lit { --k: var(--form); border-radius: 3px; padding: 0 1px; background: color-mix(in srgb, var(--k) 9%, transparent); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--k) 85%, transparent); transition: background-color .12s, box-shadow .12s; }
.lit.k-foil { --k: var(--foil); }
.lit .lt { font: 600 9.5px var(--font-ui); color: var(--k); margin-left: 2px; vertical-align: 7px; letter-spacing: .03em; text-indent: 0; }
.lit.hl { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 -2px 0 var(--accent); }
.lit.hl .lt { color: var(--accent); }
.copyright { max-width: 760px; margin: 28px auto 0; font-size: 12px; color: var(--muted); }

/* Extras lines and panel (web/src/ui/extras/extras.css) */
.xt-notes { display: flex; flex-direction: column; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); font: 13.5px/1.45 var(--font-ui); color: var(--muted); }
.xt-notes.xt-chapter { max-width: 760px; margin: -6px auto 14px; padding-top: 0; border-top: 0; }
.xt-line { display: flex; align-items: baseline; gap: 6px; width: 100%; margin: 0; padding: 2px 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; }
.xt-tap:hover .xt-words, .xt-on .xt-words { color: var(--ink); }
.xt-chev { flex: none; padding: 0 2px; color: var(--accent); transition: transform .15s ease-out; }
.xt-tap:hover .xt-chev, .xt-on .xt-chev { transform: translateX(2px); }
.xt-more { align-self: flex-start; padding: 2px 0; border: 0; background: none; font: 12.5px var(--font-ui); color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.xt-line:is([data-x='quotes'], [data-x='form'], [data-x='foil']) .xt-words::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; background: var(--xt-kind); }
.xt-line[data-x='quotes'] { --xt-kind: var(--quote); }
.xt-line[data-x='form'] { --xt-kind: var(--form); }
.xt-line[data-x='foil'] { --xt-kind: var(--foil); }
.xt-scrim { position: absolute; inset: 0; z-index: 18; background: rgba(6, 10, 22, .32); }
.xt-panel { position: absolute; z-index: 19; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font: 14px/1.45 var(--font-ui); }
.xt-dock { top: 0; right: 0; bottom: 0; width: min(440px, 100%); border-left: 1px solid var(--line); box-shadow: -18px 0 40px -28px rgba(6, 10, 22, .5); }
.xt-sheet { left: 0; right: 0; bottom: 0; height: 52%; max-height: calc(100% - 48px); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 40px rgba(6, 10, 22, .35); }
.xt-head { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--line); position: relative; }
.xt-sheet .xt-head { padding-top: 20px; }
.xt-grab { position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--muted); opacity: .35; }
.xt-titles { flex: 1; min-width: 0; }
.xt-head h2 { margin: 0; font: 600 18px/1.25 var(--font-read); }
.xt-at { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.xt-close { flex: none; display: grid; place-items: center; width: 32px; height: 32px; margin-top: -4px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--muted); }
.xt-close:hover { color: var(--ink); border-color: var(--muted); }
.xt-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 14px 18px 32px; }
.xt-body h3 { margin: 20px 0 8px; font: 600 13px var(--font-ui); color: var(--muted); }
.xt-body .xt-lead { margin: 0 0 10px; font: 15.5px/1.55 var(--font-read); color: var(--ink); }
.xt-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; align-items: start; margin: 4px 0 10px; }
.xt-passage { min-width: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
.xt-pref { font: 600 12.5px var(--font-ui); color: var(--accent); margin: 0 0 4px; }
.xt-ptext { margin: 0 0 8px; font: 15px/1.55 var(--font-read); }
.xt-ptext:last-child { margin-bottom: 0; }

/* The new extra's own sheet: x-form- */
.x-form-strip { position: relative; height: 128px; margin: 0 0 12px; border-radius: var(--r-md); overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 85%, #141a3c, var(--sky) 70%); }
.x-form-strip svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.x-form-strip [data-pair] { cursor: default; }
.x-form-str { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
.x-form-ladder { margin: 0 0 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); font: 15px/1.6 var(--font-read); }
.x-form-ladder .r { font: 600 12px var(--font-ui); color: var(--accent); margin: 6px 0 2px; }
.x-form-ladder .r:first-child { margin-top: 0; }
.x-form-ladder .ln { text-indent: -1.3em; }
.x-form-full { grid-column: 1 / -1; }
.layers-in { list-style: none; margin: 4px 0 0; padding: 0; }
.layer + .layer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.layerhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.layer .kind { font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--form); }
.layer.k-foil .kind { color: var(--foil); }
.layer .strength { font-size: 12px; color: var(--muted); }
.layer p { margin: 0; font: 15px/1.55 var(--font-read); }
p.layerdeep { margin: 6px 0 0; font: 12px/1.55 var(--font-ui); color: var(--muted); }
p.layerdeep q { quotes: '\201C' '\201D'; color: var(--ink); }
.layerlinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.layerref { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--link); font-size: 12.5px; }
.layerref .qmark { margin-right: -3px; font: 600 16px/0 var(--font-read); color: var(--quote); }
.chip { display: inline-flex; gap: 5px; align-items: baseline; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; background: var(--surface-2); }
.chip .o { font-size: 15px; font-family: var(--font-hebrew); direction: rtl; }
.chip.hl { border-color: var(--accent); background: var(--accent-soft); }
.x-form-bars { display: grid; gap: 3px; margin: 8px 0 2px; font-size: 12px; color: var(--muted); }
.x-form-bars div { display: grid; grid-template-columns: 70px 1fr 34px; gap: 8px; align-items: center; }
.x-form-bars i { display: block; height: 5px; border-radius: 3px; background: var(--g); opacity: .85; }
.x-form-bars b { font-weight: 500; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.x-form-r { font: 600 11px var(--font-ui); color: var(--accent); margin-right: 4px; }
.x-form-src { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.x-form-src b, .x-form-str b { font-weight: 600; color: var(--ink); }
.x-form-str a, .x-form-by a, .x-form-defsrc a { color: var(--link); text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 2px; }
/* What the device is, in the defining writer's own words, with the page it is on. */
.x-form-def { margin: 0 0 12px; padding: 9px 12px 10px; border-left: 2px solid var(--form); border-radius: 0 var(--r-md) var(--r-md) 0; background: color-mix(in srgb, var(--form) 6%, var(--surface)); }
.k-foil-panel .x-form-def { border-left-color: var(--foil); background: color-mix(in srgb, var(--foil) 6%, var(--surface)); }
.x-form-defhead { margin: 0 0 3px; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.x-form-defp { margin: 0; font-size: 13.5px; line-height: 1.45; }
.x-form-term { color: var(--muted); font-size: 12.5px; }
.x-form-term::before { content: '· '; }
.x-form-defw { margin: 4px 0 0; font: 14.5px/1.5 var(--font-read); color: var(--ink); }
.x-form-defw q { quotes: '\201C' '\201D'; }
.x-form-defsrc { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.layer p.x-form-by { margin: 5px 0 0; font: 12.5px/1.45 var(--font-ui); color: var(--muted); }
.x-form-ladder .ln.q0 { padding-left: 0; text-indent: 0; }

.mobtabs { display: none; }
.mk-empty { padding: 30px 18px; color: var(--muted); font: 15px/1.6 var(--font-read); }

@container app (max-width: 900px) {
  .topbar { flex-wrap: wrap; padding: 8px 12px; }
  .brand small { display: none; }
  .searchbox { order: 3; flex: 1 1 200px; max-width: none; }
  .topbar .mapstyle { order: 4; }
  .searchbox kbd { display: none; }
  .map { height: 300px; }
  .map .hud .legend, .map .hud .colors, .map .hud .down { display: none; }
  .map .hud, .map .litcap { max-width: calc(100% - 140px); }
  .map .hud .litname { display: none; }
  .map .zoomhint { max-width: 130px; }
  .work { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .mobtabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
  .mobtabs button { flex: 1; border: 0; background: none; padding: 10px; color: var(--muted); border-bottom: 2px solid transparent; }
  .mobtabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--accent); }
  .work[data-pane='read'] .study, .work[data-pane='study'] .reader { display: none; }
  .reader { border-right: 0; padding: 14px 16px 60px; }
  .readhead h1 { font-size: 22px; }
  .verse .en { font-size: 16.5px; }
  .orig.he { font-size: 20px; }
  .depthhint { right: auto; left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ------------------------------------------------ marking words */
function lit(before, word, after, pair, kind, letter) {
  return before + '<span class="lit' + (kind === 'foil' ? ' k-foil' : '') + '" data-pair="' + pair + '">' + esc(word) + (letter ? '<sup class="lt">' + letter + '</sup>' : '') + '</span>' + after;
}
function wordRe(p) { return new RegExp('(^|[^A-Za-z’])(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![A-Za-z])', 'g'); }
/** Marks for one verse, gated by level, as [{p, occ, pair, letter, kind}] */
function verseMarks(ex, v) {
  var out = [];
  (ex.marks || []).forEach(function (m) { if (m.v === v && at(m.lv)) out.push(m); });
  if (ex.words && at(ex.words.lv)) ex.words.items.forEach(function (m) { if (m.v === v) out.push(m); });
  return out;
}
function letterOf(m) {
  if (m.letter) return m.letter;
  if (!m.end) return '';
  var base = m.pair.replace(/\d+$/, '');
  return base + (m.end === 2 ? '′' : '');
}
/** Wrap marked phrases inside one verse's lines; a phrase's occurrences count across the whole verse. */
function renderMarkedVerse(ex, v, lines) {
  var marks = verseMarks(ex, v);
  var byP = {};
  marks.forEach(function (m) { (byP[m.p] = byP[m.p] || []).push(m); });
  var showLetters = at('study');
  var count = {};
  var kind = ex.kind;
  return lines.map(function (t) {
    var hits = [];
    Object.keys(byP).forEach(function (p) {
      var re = wordRe(p), r;
      while ((r = re.exec(t))) hits.push({ s: r.index + r[1].length, p: p });
    });
    hits.sort(function (a, b) { return a.s - b.s || b.p.length - a.p.length; });
    var out = '', at0 = 0;
    hits.forEach(function (h) {
      count[h.p] = (count[h.p] || 0) + 1;
      var n = count[h.p];
      var m = byP[h.p].filter(function (x) { return !x.occ || x.occ === n; })[0];
      if (!m || h.s < at0) return;
      out += esc(t.slice(at0, h.s));
      var L = showLetters ? letterOf(m) : '';
      out += '<span class="lit' + (kind === 'foil' ? ' k-foil' : '') + '" data-pair="' + m.pair + '">' + esc(t.slice(h.s, h.s + h.p.length)) + (L ? '<sup class="lt">' + L + '</sup>' : '') + '</span>';
      at0 = h.s + h.p.length;
    });
    return out + esc(t.slice(at0));
  });
}

/* ------------------------------------------------ the reader */
function rowsOf(ex) { return V[ex.rows]; }
function rowOf(ex, v) { var r = rowsOf(ex); for (var i = 0; i < r.length; i++) if (r[i].v === v) return r[i]; return null; }

function verseHTML(ex, row) {

      return map[i] ? '<span class="w lit' + (ex.kind === 'foil' ? ' k-foil' : '') + '" data-pair="' + map[i] + '" title="' + esc(w[1] + ' · ' + w[2]) + '">' + w[0] + '</span>' : '<span class="w" title="' + esc(w[1] + ' · ' + w[2]) + '">' + w[0] + '</span>';
    }).join(' ') + '</div>';
  }

  return html + '</div>';
}

  return html + '</div>';
}

/* ------------------------------------------------ the panel (the new extra) */
function stripHolder(ex) { return '<div class="x-form-strip" data-strip="1" aria-hidden="true"><svg></svg></div>'; }
function chipsFor(ex, list) {

/** A verse opened word by word: the lens on the map, or the panel strip. */
function wordScene(ex, W, H, opt) {
  var spec = ex.words, out = [];
  var texts = spec.verses.map(function (v) { var r = rowOf(ex, v); return r.lines ? r.lines.map(function (l) { return l.t; }) : [r.en]; });
  var full = [], starts = [], vstarts = [], off = 0;
  texts.forEach(function (lines, vi) {
    vstarts.push(off);
    lines.forEach(function (t) { starts.push(off); full.push(t); off += t.length + 1; });
  });
  var total = off - 1;
  var pad = 22;
  var showLet = at('study'), showHe = at('study') && spec.heb && W > 300 && H > 150;
  var labelSpace = 30 + (showHe ? 18 : 0);
  var base = H - labelSpace - 6, hmax = base - (opt.top || 24);
  var px = function (o) { return pad + (o / total) * (W - 2 * pad); };
  // baseline, line ticks, verse ticks
  out.push('<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + base.toFixed(1) + '" y2="' + base.toFixed(1) + '" stroke="rgba(241,236,223,0.22)"/>');
  starts.forEach(function (s) { var x = px(s); out.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (base - 3) + '" y2="' + (base + 4) + '" stroke="rgba(241,236,223,0.3)"/>'); });
  if (spec.verses.length > 1) vstarts.forEach(function (s, i) { if (i === 0) return; var x = px(s); out.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (base - 10) + '" y2="' + (base + 6) + '" stroke="rgba(241,236,223,0.45)"/><text class="chaplabel" x="' + (x + 3).toFixed(1) + '" y="' + (base - 12).toFixed(1) + '">' + rowOf(ex, spec.verses[i]).c + ':' + spec.verses[i] + '</text>'); });
  // find each item in the joined text
  var count = {};
  var nodes = spec.items.map(function (it) {
    var vi = spec.verses.indexOf(it.v);
    var vtext = texts[vi].join(' ');
    var re = wordRe(it.p), r, n = 0, found = -1;
    while ((r = re.exec(vtext))) { n++; if (!it.occ || it.occ === n) { found = r.index + r[1].length; break; } }
    var o = vstarts[vi] + found + it.p.length / 2;
    return { x: px(o), it: it };
  });
  var k = KSKY[ex.kind];
  var pairs = {};
  nodes.forEach(function (n) { (pairs[n.it.pair] = pairs[n.it.pair] || []).push(n); });
  Object.keys(pairs).forEach(function (p) {
    var a = pairs[p][0], b = pairs[p][1];
    if (!b) return;
    var arc = arcPath(a.x, b.x, base, hmax, W);
    var g = '<g class="sarc" style="--k:' + k + '" data-pair="' + p + '"><path d="' + arc.d + '"/><circle cx="' + a.x.toFixed(1) + '" cy="' + base.toFixed(1) + '" r="2.5"/><circle cx="' + b.x.toFixed(1) + '" cy="' + base.toFixed(1) + '" r="2.5"/>';
    var tag = spec.tags && spec.tags[p];
    if (tag && at('study')) g += '<text class="stag" x="' + ((a.x + b.x) / 2).toFixed(1) + '" y="' + (base - arc.h - 5).toFixed(1) + '" text-anchor="middle">' + tag + '</text>';
    out.push(g + '</g>');
  });
  if (spec.turn && at('study')) {
    var vt = texts[spec.verses.indexOf(spec.turn.v)].join(' ');
    var tx = px(vstarts[spec.verses.indexOf(spec.turn.v)] + vt.indexOf(spec.turn.p));
    out.push('<line class="sturn" x1="' + tx.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y1="' + (base + 3).toFixed(1) + '" y2="' + (base - hmax * 0.16).toFixed(1) + '"/><text class="stag" style="--k:#949cbd" x="' + tx.toFixed(1) + '" y="' + (base - hmax * 0.16 - 4).toFixed(1) + '" text-anchor="middle">turn</text>');
  }
  // Labels below the baseline: the word with its letter beside it, on a second row when crowded.
  var last = [-1e9, -1e9];
  nodes.forEach(function (n) {
    var L = showLet ? letterOf(n.it) : '';

    }
    out.push(txt);
  });
  return out.join('');
}

}
function scrollReaders() {
  // As the app does, bring the selected verse into view in the reader.
  stage.querySelectorAll('.reader').forEach(function (r) {
    var sel = r.querySelector('.verse.sel');
    if (!sel) return;
    var top = sel.offsetTop - r.offsetTop;
    r.scrollTop = top + Math.min(sel.offsetHeight, 220) < r.clientHeight - 20 ? 0 : Math.max(0, top - 90);
  });
}
var rT = 0;
window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { var was = S.narrow.d; render(); }, 120); });

document.addEventListener('click', function (e) {
  var t = e.target.closest('button, [data-close]');
  if (!t) return;
  var dev = t.closest('[data-inst]');
  var inst = dev ? dev.getAttribute('data-inst') : null;
  if (t.hasAttribute('data-ex')) { S.ex = t.getAttribute('data-ex'); S.open = { d: true, p: true }; S.pane = { d: 'read', p: 'read' }; render(); return; }
  if (t.hasAttribute('data-view')) { S.view = t.getAttribute('data-view'); render(); return; }
  if (t.hasAttribute('data-depth')) { S.level = t.getAttribute('data-depth'); flashHint(); render(); return; }
  if (t.hasAttribute('data-to')) { S.level = t.getAttribute('data-to'); flashHint(); render(); return; }
  if (t.hasAttribute('data-theme-toggle') || t.hasAttribute('data-theme-set')) {
    var r = document.documentElement, next = t.getAttribute('data-theme-set') || (r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    r.setAttribute('data-theme', next);
    try { localStorage.setItem('mk.theme', next); } catch (err) {}
    render();
    return;
  }
  if (t.hasAttribute('data-open') && inst) { S.open[inst] = true; render(); return; }
  if (t.hasAttribute('data-close') && inst) { S.open[inst] = false; render(); return; }
  if (t.hasAttribute('data-pane-to') && inst) { S.pane[inst] = t.getAttribute('data-pane-to'); render(); return; }
});
var hT = 0;
function flashHint() { S.hint = true; clearTimeout(hT); hT = setTimeout(function () { S.hint = false; document.querySelectorAll('.depthhint').forEach(function (h) { h.classList.remove('on'); }); }, 4000); }

// Hover a lit word or arc: its partner lights in lamp gold everywhere in that device.
var lastHl = null;
document.addEventListener('mouseover', function (e) {
  var el = e.target.closest && e.target.closest('[data-pair]');
  var dev = e.target.closest && e.target.closest('[data-inst]');
  var key = el && dev ? dev.getAttribute('data-inst') + ':' + el.getAttribute('data-pair') : null;
  if (key === lastHl) return;
  document.querySelectorAll('.hl').forEach(function (x) { x.classList.remove('hl'); });
  lastHl = key;
  if (!key) return;
  dev.querySelectorAll('[data-pair="' + el.getAttribute('data-pair') + '"]').forEach(function (x) { x.classList.add('hl'); });
});

render();
})();
</script>
</body>
