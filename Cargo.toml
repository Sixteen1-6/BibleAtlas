[workspace]
resolver = "2"
members = ["crates/atlas-core", "crates/atlas-cli", "crates/atlas-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The WebAssembly engine is built with this profile: small binary, still fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
